image:
  repository: opsdeck
  tag: latest
  pullPolicy: IfNotPresent

# Non-secret settings (become env vars). See .env.example for every option.
config:
  OPSDECK_ENV_NAME: prod
  OPSDECK_DEMO: "auto"
  OPSDECK_ENABLE_WRITES: "false"
  OPSDECK_LLM_PROVIDER: anthropic       # anthropic | bedrock | openai | gemini | ollama | none
  # OPSDECK_WIDGET_PYTHON: approval     # approval (admin approves each data.py) | off | trusted
  # OPSDECK_WIDGET_AUTHOR_ROLE: operator
  # OPENAI_BASE_URL: http://litellm.ai.svc:4000/v1   # any OpenAI-compatible gateway
  # OLLAMA_URL: http://ollama.ai.svc:11434
  # GITHUB_ORG: acme
  # GITHUB_API_URL: https://ghe.acme.com/api/v3
  # PROMETHEUS_URL: http://prometheus-operated.monitoring.svc:9090
  # ALERTMANAGER_URL: http://alertmanager-operated.monitoring.svc:9093
  # LOKI_URL: http://loki-gateway.monitoring.svc
  # TEMPO_URL: http://tempo-query-frontend.monitoring.svc:3200
  # GRAFANA_URL: https://grafana.acme.internal
  # RANCHER_URL: https://rancher.acme.internal
  # DD_SITE: datadoghq.com
  # NEW_RELIC_ACCOUNT_ID: "1234567"
  # PRISMA_COMPUTE_URL: https://us-east1.cloud.twistlock.com/us-1-111111111
  # CVE_INTEL_ENABLED: "true"
  # HOLMES_URL: http://holmesgpt.holmes.svc:5050
  # K8S_NAMESPACES: "payments,checkout,flux-system"
  # AWS_REGIONS: "us-east-1"
  # ARGOCD_URL: https://argocd.acme.internal
  # JENKINS_URL: https://jenkins.acme.internal
  # JIRA_URL: https://acme.atlassian.net
  # CONFLUENCE_URL: https://acme.atlassian.net/wiki
  # ARTIFACTORY_URL: https://acme.jfrog.io/artifactory
  # PRISMA_URL: https://api.prismacloud.io

# Name of an existing Secret holding tokens (ANTHROPIC_API_KEY, ARGOCD_TOKEN,
# JENKINS_USER, JENKINS_TOKEN, JIRA_USER, JIRA_TOKEN, CONFLUENCE_USER, CONFLUENCE_TOKEN,
# ARTIFACTORY_TOKEN, PRISMA_ACCESS_KEY, PRISMA_SECRET_KEY, OPSDECK_SECRET, OPENAI_API_KEY, GEMINI_API_KEY,
# GITHUB_TOKEN, PAGERDUTY_TOKEN, PAGERDUTY_FROM, GRAFANA_TOKEN, DD_API_KEY, DD_APP_KEY, NEW_RELIC_API_KEY,
# RANCHER_TOKEN, PROMETHEUS_TOKEN, LOKI_TOKEN, TEMPO_TOKEN, NVD_API_KEY).
# Create it with: kubectl -n opsdeck create secret generic opsdeck-secrets --from-env-file=prod.env
existingSecret: opsdeck-secrets

# Who can do what when oauth2Proxy is enabled (emails, comma-separated).
roles:
  admins: ""
  operators: ""
  defaultRole: viewer

# Authentication. Leave disabled ONLY for single-user access via `kubectl port-forward`
# (everyone who can reach the Service is admin). Enable for any shared use.
oauth2Proxy:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  # Secret with client-id, client-secret, cookie-secret keys
  existingSecret: opsdeck-oauth2
  provider: oidc
  oidcIssuerUrl: ""          # e.g. https://login.microsoftonline.com/<tenant>/v2.0 or your Okta issuer
  emailDomains: ["*"]
  extraArgs: []

kubernetes:
  enabled: true               # use the in-cluster service account
  # Grant write verbs (rollout restart, scale, Flux reconcile). Reads are always granted.
  allowWrites: false
  # Limit RBAC to these namespaces (Role per namespace). Empty = ClusterRole (all namespaces).
  namespaces: []

serviceAccount:
  # e.g. eks.amazonaws.com/role-arn for IRSA so the AWS widget uses a read-only IAM role
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: opsdeck.example.com
  annotations: {}
  tlsSecret: ""

persistence:
  enabled: false              # keep the audit DB, custom widgets, approvals and dashboards across restarts
  size: 1Gi
  storageClass: ""

resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 512Mi }

# e.g. mount a CA bundle and set config.OPSDECK_CA_BUNDLE=/etc/opsdeck-ca/ca.pem
extraVolumes: []
#  - name: corp-ca
#    configMap: { name: corp-ca }
extraVolumeMounts: []
#  - { name: corp-ca, mountPath: /etc/opsdeck-ca, readOnly: true }

nodeSelector: {}
tolerations: []
