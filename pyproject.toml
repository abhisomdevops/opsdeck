[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdeck"
version = "0.2.0"
description = "AI-agent SRE platform: one console for incidents, observability, Kubernetes, delivery and security, with hot-reloadable AI-built widgets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "kubernetes>=30.1",
    "boto3>=1.34",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
opsdeck = "opsdeck.main:run"

[tool.setuptools.packages.find]
include = ["opsdeck*"]

[tool.setuptools.package-data]
opsdeck = ["static/*", "playbooks/*.md", "widgets/*.js", "widgets/*.css", "widgets/*.md", "widgets_builtin/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiomatic pattern
per-file-ignores = { "tests/conftest.py" = ["E402"] }
